name: Metronome
options:
  bundleIdPrefix: com.florian
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Metronome:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [Metronome]
    info:
      path: Metronome/Info.plist
      properties:
        CFBundleDisplayName: Métronome
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florian.metronome
        PRODUCT_NAME: Metronome
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_HARDENED_RUNTIME: NO
  MetronomeTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [MetronomeTests]
    dependencies:
      - target: Metronome
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.florian.metronome.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Metronome.app/Contents/MacOS/Metronome
        "TEST_HOST[sdk=iphone*]": $(BUILT_PRODUCTS_DIR)/Metronome.app/Metronome
        BUNDLE_LOADER: $(TEST_HOST)
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
schemes:
  Metronome:
    build:
      targets:
        Metronome: all
        MetronomeTests: [test]
    test:
      targets: [MetronomeTests]
